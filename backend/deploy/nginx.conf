server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/photo-gallery/current/backend/public;
    index index.php;

    # Must be above the 50 MB PHP limit so uploads reach Laravel.
    client_max_body_size 55M;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public derived images use UUID paths that never change.
    location ^~ /storage/photos/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/photo-gallery.access.log;
    error_log /var/log/nginx/photo-gallery.error.log;
}
