[program:photo-gallery-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/photo-gallery/current/backend/artisan queue:work database --sleep=3 --tries=3 --timeout=120 --memory=1024 --max-time=3600
directory=/var/www/photo-gallery/current/backend
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/photo-gallery/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=130
