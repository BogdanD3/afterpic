server {
    listen 80 default_server;
    server_name _;

    # The host Nginx forwards the real client IP in X-Forwarded-For.
    # Trust it only from private (Docker) networks, so rate limiting sees real IPs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Must stay above the 50 MB app limit and the PHP limits (55M / 56M).
    client_max_body_size 55M;

    add_header X-Content-Type-Options "nosniff" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Laravel API and health check
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # Processed photos. UUID paths never change, so they can be cached forever.
    location ^~ /storage/photos/ {
        root /var/www/html/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # React app
    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
    }

    location ^~ /assets/ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
