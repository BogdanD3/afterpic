[www]
; Only Nginx inside this container talks to PHP-FPM.
listen = 127.0.0.1:9000

; Keep the container environment, otherwise Laravel cannot read the settings
; passed by Docker (TRUSTED_PROXIES and the like).
clear_env = no

; The image default is 5 PHP workers, so with a few hundred phones polling
; every 5 seconds requests start to queue. 12 workers handle several hundred
; requests per second; each uses about 30-60 MB of RAM while busy.
; Uploads do not hold a worker while they arrive: Nginx receives the whole
; file first and only then hands it to PHP.
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
